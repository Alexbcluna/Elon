<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha agenda</title>
<style>
/* ===== 1. TEMAS =====
   Todas as cores ficam em variáveis (--nome). Para mudar o visual do app
   inteiro basta trocar estes valores. Cada tema é um bloco [data-theme]. */
:root {
  --fundo: #e9eee9; --papel: #f8faf7; --tinta: #1d2b3a; --suave: #66758a;
  --linha: #cdd7cf; --destaque: #2f6f5e; --hoje: #d9ece4;
  --fonte-titulo: "Bricolage Grotesque", Georgia, serif;
  --fonte-texto: "Figtree", system-ui, sans-serif;
  color-scheme: light;
}
:root[data-theme="noite"] {
  --fundo: #11161d; --papel: #19212b; --tinta: #e6ecf2; --suave: #8c9aad;
  --linha: #2b3644; --destaque: #6fd0b0; --hoje: #23403a; color-scheme: dark;
}
:root[data-theme="lavanda"] {
  --fundo: #ebe8f4; --papel: #f9f8fd; --tinta: #2a2347; --suave: #70688f;
  --linha: #d4cfe6; --destaque: #6a4fd1; --hoje: #e1daf7;
}
/* Temas rock e góticos: cada um troca a paleta e a fonte do título */
:root[data-theme="vampiro"] {
  --fundo: #0a0608; --papel: #150b0e; --tinta: #ecdcd8; --suave: #a07f80;
  --linha: #4a1620; --destaque: #c0152f; --hoje: #3a0f17;
  --fonte-titulo: "Pirata One", Georgia, serif; color-scheme: dark;
}
:root[data-theme="metal"] {
  --fundo: #121315; --papel: #1b1c1f; --tinta: #e4e6e8; --suave: #8d9298;
  --linha: #3a3d42; --destaque: #e8a32b; --hoje: #33291a;
  --fonte-titulo: "Metal Mania", Georgia, serif; color-scheme: dark;
}
:root[data-theme="cemiterio"] {
  --fundo: #0d1210; --papel: #141c18; --tinta: #dfe6dc; --suave: #8a9a8c;
  --linha: #2a3a30; --destaque: #9fd18b; --hoje: #1f3326;
  --fonte-titulo: "Pirata One", Georgia, serif; color-scheme: dark;
}
:root[data-theme="punk"] {
  --fundo: #0b0b0b; --papel: #161616; --tinta: #f5f5f0; --suave: #9a9a90;
  --linha: #3a3a3a; --destaque: #ff2e93; --hoje: #3a1428;
  --fonte-titulo: "New Rocker", Georgia, serif; color-scheme: dark;
}
/* Bruxaria wiccana: noite roxa com prata e violeta lunar */
:root[data-theme="bruxa"] {
  --fundo: #0e0a1a; --papel: #171128; --tinta: #e9e4f5; --suave: #9a8fb8;
  --linha: #3a2d5c; --destaque: #b48cff; --hoje: #2a2047;
  --fonte-titulo: "Pirata One", Georgia, serif; color-scheme: dark;
}
/* Inspirado em Stray Kids: preto, vermelho intenso e branco, visual de rua */
:root[data-theme="skz"] {
  --fundo: #0a0a0a; --papel: #141414; --tinta: #f4f4f4; --suave: #9b9b9b;
  --linha: #3d1519; --destaque: #e5202e; --hoje: #3b1216;
  --fonte-titulo: "New Rocker", Georgia, serif; color-scheme: dark;
}
/* Inspirado em Måneskin: glam rock, preto com dourado e brilho */
:root[data-theme="maneskin"] {
  --fundo: #100b0b; --papel: #1a1210; --tinta: #f6ead8; --suave: #b39d84;
  --linha: #4a3320; --destaque: #e6b450; --hoje: #3a2a14;
  --fonte-titulo: "Metal Mania", Georgia, serif; color-scheme: dark;
}
:root[data-theme="hollow"] {   /* Hollow Knight: abismo azul-noite e luz pálida da alma */
  --fundo: #070a12; --papel: #0e1320; --tinta: #dfe8f0; --suave: #7f93a8;
  --linha: #2a3548; --destaque: #9fd8ff; --hoje: #16233a;
  --fonte-titulo: "Cinzel", Georgia, serif; color-scheme: dark;
}
:root[data-theme="grimorio"] {   /* Grimório wiccano: pergaminho escuro e ouro velho */
  --fundo: #14100b; --papel: #1f1810; --tinta: #eadfc6; --suave: #a8987a;
  --linha: #4a3a22; --destaque: #c9973b; --hoje: #35280f;
  --fonte-titulo: "Uncial Antiqua", Georgia, serif; color-scheme: dark;
}
/* Se a pessoa nunca escolheu tema, segue o modo do aparelho */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme]) {
    --fundo: #11161d; --papel: #19212b; --tinta: #e6ecf2; --suave: #8c9aad;
    --linha: #2b3644; --destaque: #6fd0b0; --hoje: #23403a; color-scheme: dark;
  }
}

/* ===== 2. LAYOUT GERAL ===== */
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--fundo); color: var(--tinta); font-family: var(--fonte-texto); }
/* Tela inteira: html, body e .app ocupam 100% da altura da janela;
   .app é uma coluna (cabeçalho + grade) e a grade cresce para preencher o resto */
html, body { height: 100%; }
/* .app é uma grade com 2 colunas: calendário (esquerda) e painel de personalização (direita) */
.app { height: 100%; min-height: 680px; display: grid; grid-template-columns: minmax(0, 1fr) 290px; grid-template-rows: auto minmax(0, 1fr); grid-template-areas: "topo painel" "grade painel"; gap: 12px 16px; padding: 12px 16px; }

/* Cabeçalho: mês/ano à esquerda, controles à direita */
.topo { grid-area: topo; display: flex; flex-wrap: wrap; align-items: center; gap: 12px; justify-content: space-between; margin-bottom: 14px; }
h1 { font: 700 2rem/1 var(--fonte-titulo); margin: 0; text-transform: capitalize; }
.controles { display: flex; gap: 8px; align-items: center; }
button, select { font: inherit; color: var(--tinta); background: var(--papel); border: 1px solid var(--linha); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
button:hover { border-color: var(--destaque); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--destaque); outline-offset: 2px; }
.primario { background: var(--destaque); border-color: var(--destaque); color: var(--papel); font-weight: 600; }

/* ===== 3. GRADE DO CALENDÁRIO =====
   CSS Grid com 7 colunas (os dias da semana). Os dias entram em ordem
   e a grade quebra a linha sozinha a cada 7 células. */
.grade { grid-area: grade; min-height: 0; grid-template-rows: auto repeat(6, minmax(0, 1fr)); display: grid; grid-template-columns: repeat(7, 1fr); background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; overflow: hidden; }
.semana { padding: 8px; text-align: center; font-weight: 600; color: var(--suave); border-bottom: 1px solid var(--linha); }
.dia { min-height: 0; overflow-y: auto; scrollbar-width: thin; padding: 6px; border-right: 1px solid var(--linha); border-bottom: 1px solid var(--linha); cursor: pointer; min-width: 0; }
.dia:nth-child(7n) { border-right: 0; }
.dia:hover { background: color-mix(in srgb, var(--destaque) 8%, transparent); }
.dia.fora { opacity: .4; }
.dia.hoje { background: var(--hoje); }
.num { font: 500 .95rem var(--fonte-titulo); }
.hoje .num { color: var(--destaque); font-weight: 700; }

/* Evento: uma "etiqueta" colorida. A cor vem da categoria via --cor */
.ev { display: block; width: 100%; margin-top: 4px; padding: 2px 6px; text-align: left; font-size: .78rem; border: 0; border-left: 4px solid var(--cor); background: color-mix(in srgb, var(--cor) 18%, var(--papel)); border-radius: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== 3b. PERSONALIZAÇÃO ROCK/GÓTICA =====
   Fundos com textura (atributo data-fundo no body) e ornamentos (classe .orn) */
body[data-fundo="riscado"] { background-image: repeating-linear-gradient(135deg, transparent 0 9px, color-mix(in srgb, var(--tinta) 7%, transparent) 9px 10px); }
body[data-fundo="pontilhado"] { background-image: radial-gradient(color-mix(in srgb, var(--tinta) 14%, transparent) 1px, transparent 1.5px); background-size: 14px 14px; }
body[data-fundo="arranhado"] { background-image: repeating-linear-gradient(80deg, transparent 0 23px, color-mix(in srgb, var(--destaque) 12%, transparent) 23px 24px), repeating-linear-gradient(100deg, transparent 0 41px, color-mix(in srgb, var(--tinta) 6%, transparent) 41px 42px); }
body[data-fundo="leopardo"] { background-image: radial-gradient(ellipse 14px 9px at 20% 30%, color-mix(in srgb, var(--destaque) 22%, transparent) 60%, transparent 62%), radial-gradient(ellipse 10px 14px at 70% 65%, color-mix(in srgb, var(--tinta) 10%, transparent) 60%, transparent 62%); background-size: 46px 46px, 38px 38px; }
body[data-fundo="estrelas"] { background-image: radial-gradient(color-mix(in srgb, var(--destaque) 55%, transparent) 1px, transparent 1.5px), radial-gradient(color-mix(in srgb, var(--tinta) 30%, transparent) 1px, transparent 1.5px); background-size: 61px 61px, 37px 37px; background-position: 0 0, 18px 22px; }
/* Ornamentos wiccanos: luas e pentagrama no título, fase da lua em cada dia */
/* Ornamentos em SVG (vetor, nítido em qualquer tamanho). Usam currentColor = cor de destaque do tema */
.marca { display: flex; align-items: center; gap: 14px; }
.orn-svg { display: none; height: 42px; width: auto; color: var(--destaque); filter: drop-shadow(0 0 5px color-mix(in srgb, var(--destaque) 50%, transparent)); }
body.orn .orn-svg { display: block; }
.lua svg { width: 15px; height: 15px; display: block; }
.lua .esc { fill: color-mix(in srgb, var(--tinta) 10%, transparent); stroke: var(--suave); stroke-width: .6; }
.lua .luz { fill: var(--tinta); }

/* Painel de personalização fixo à direita */
.painel { grid-area: painel; background: var(--papel); border: 1px solid var(--linha); border-radius: 12px; padding: 18px; overflow-y: auto; }
.painel h2 { font: 700 1.5rem var(--fonte-titulo); margin: 0 0 6px; }
.pers { display: flex; flex-direction: column; gap: 6px; }
.pers label { margin-top: 10px; font-size: .95rem; font-weight: 600; color: var(--tinta); }
.pers select, .pers button { width: 100%; font-size: 1rem; padding: 10px 12px; }
.roda { display: none; width: 100%; max-width: 230px; margin: 18px auto 0; color: var(--destaque); }
body.orn .roda { display: block; }

/* Pop-up de aviso e mensagem de erro */
.erro { color: #e5484d; font-size: .85rem; margin: 10px 0 0; min-height: 1.2em; }
.aviso { text-align: center; border: 2px solid var(--destaque); box-shadow: 0 0 40px color-mix(in srgb, var(--destaque) 55%, transparent); }
.aviso h2 { font: 700 2rem/1.1 var(--fonte-titulo); margin: 6px 0; }
.aviso p { margin: 0; color: var(--suave); }
.aviso .aviso-hora { font: 700 1.5rem var(--fonte-titulo); color: var(--destaque); }
.aviso-svg { width: 64px; height: 64px; color: var(--destaque); }
@media (prefers-reduced-motion: no-preference) { .aviso-svg { animation: pulso 1.6s ease-in-out infinite; } }
@keyframes pulso { 50% { transform: scale(1.12); } }
@media (max-width: 800px) {
  .app { height: auto; min-height: 100%; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 70vh auto; grid-template-areas: "topo" "grade" "painel"; }
}
.lua { display: none; float: right; font-size: .85rem; }
body.orn .lua { display: inline; }
body.orn .grade { border: 3px double var(--destaque); box-shadow: 0 0 28px color-mix(in srgb, var(--destaque) 35%, transparent); }
body.orn .dia:hover { box-shadow: inset 0 0 16px color-mix(in srgb, var(--destaque) 40%, transparent); }
button[aria-pressed="true"] { border-color: var(--destaque); color: var(--destaque); }

/* ===== 3c. ACABAMENTO, SEMANA, TAREFAS E IMPORTAÇÃO ===== */
[hidden] { display: none !important; }
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-variant-numeric: tabular-nums; line-height: 1.4; }
svg { shape-rendering: geometricPrecision; }
button, select { transition: border-color .15s, background-color .15s, transform .1s; box-shadow: 0 1px 0 color-mix(in srgb, var(--tinta) 8%, transparent); }
button:active { transform: translateY(1px); }
.grade, .painel { box-shadow: 0 10px 30px -12px rgba(0,0,0,.45); }
h1 { letter-spacing: .01em; }
.semana { background: color-mix(in srgb, var(--tinta) 4%, var(--papel)); }
.ev { border: 1px solid color-mix(in srgb, var(--cor) 35%, transparent); border-left: 4px solid var(--cor); font-weight: 600; transition: transform .12s, background-color .12s; }
.ev:hover { transform: translateX(2px); background: color-mix(in srgb, var(--cor) 30%, var(--papel)); }
.hoje .num { display: inline-grid; place-items: center; min-width: 1.7em; height: 1.7em; border-radius: 50%; background: var(--destaque); color: var(--papel); }
.grade.sem { grid-template-rows: auto minmax(0, 1fr); }
.sem .dia { padding: 10px; }
.sem .ev { font-size: .9rem; padding: 6px 8px; margin-top: 6px; white-space: normal; }
.sem .num { font-size: 1.3rem; }
.abas { display: flex; gap: 6px; margin-bottom: 12px; }
.abas button { flex: 1; font-weight: 600; }
.nova { display: flex; gap: 6px; }
.nova input { margin: 0; }
.lista-tar { list-style: none; padding: 0; margin: 10px 0; }
.tarefa { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--linha); }
.tarefa span { flex: 1; overflow-wrap: anywhere; }
.tarefa.feita span { text-decoration: line-through; color: var(--suave); }
.tarefa input { width: auto; margin: 0; accent-color: var(--destaque); }
.tarefa button { padding: 2px 9px; }
.msg { font-size: .85rem; min-height: 1.2em; color: var(--destaque); margin: 4px 0; }
textarea { width: 100%; font: .8rem/1.4 ui-monospace, Menlo, monospace; color: var(--tinta); background: var(--fundo); border: 1px solid var(--linha); border-radius: 8px; padding: 8px 10px; resize: vertical; }
.pers input[type=file] { padding: 6px; font-size: .85rem; }
/* Cor de destaque: bolinhas prontas + seletor livre */
.cores { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; justify-items: center; padding: 6px 0; }
.pers .cores button { width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--tinta) 25%, transparent); }
.pers .cores button:hover { transform: scale(1.12); }
.pers .cores button[aria-pressed="true"] { outline: 2px solid var(--tinta); outline-offset: 2px; border-color: var(--papel); }
.cor-custom { display: flex; align-items: center; gap: 8px; }
.cor-custom input { width: 56px; margin: 0; flex: none; }
.cor-custom .hex { flex: 1; font: .85rem ui-monospace, Menlo, monospace; color: var(--suave); }
.pers .cor-custom button { width: auto; flex: none; }
/* Abas do painel, cronograma, cores de categoria e tarefas com subtarefas */
.abas button { padding: 8px 4px; font-size: .88rem; }
.cron-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.cron-nav strong { text-transform: capitalize; text-align: center; font: 700 1.1rem var(--fonte-titulo); }
.cron { list-style: none; padding: 0; margin: 0; }
.cron-item { display: grid; grid-template-columns: auto 56px 1fr; gap: 2px 10px; margin: 8px 0; padding: 8px 10px; border-left: 4px solid var(--cor); background: color-mix(in srgb, var(--cor) 14%, var(--papel)); border-radius: 0 8px 8px 0; }
.cron-item time { grid-row: 1 / 3; font-weight: 600; color: var(--suave); }
.cron-item button { border: 0; background: none; box-shadow: none; padding: 0; text-align: left; font-weight: 600; }
.cron-item small, .vazio { color: var(--suave); }
#secCron > button { width: 100%; margin-top: 8px; padding: 10px; }
.cat-linha { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
.cat-linha input { width: 48px; height: 34px; margin: 0; flex: none; }
.nova-col { flex-direction: column; }
.nova-col button { width: 100%; }
.tarefa .corpo { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.tarefa .corpo small { color: var(--suave); overflow-wrap: anywhere; }
.tarefa.feita .corpo { text-decoration: line-through; color: var(--suave); }
.tarefa .prog { flex: none; font-size: .8rem; color: var(--suave); }
.subs { list-style: none; margin: 0; padding: 0 0 0 20px; }
details.geral { padding: 2px 0 10px; }
details.geral summary { cursor: pointer; }
details.geral .nova { margin: 8px 0 0 20px; }
.cron-sep { margin: 16px 0 4px; font: 700 1.05rem var(--fonte-titulo); color: var(--destaque); }
.cor-ev { display: flex; align-items: center; gap: 12px; margin-top: 4px; }
.cor-ev input[type=color] { width: 56px; height: 38px; margin: 0; flex: none; }
.cor-ev input[type=checkbox] { width: auto; margin: 0; accent-color: var(--destaque); }
.usa-cat { display: flex; align-items: center; gap: 6px; margin: 0; }
.nova-col label input { margin-top: 4px; }
/* Dia selecionado, formulário de evento dentro do cronograma e bullet redondo de tarefa */
.dia.sel { outline: 2px solid var(--destaque); outline-offset: -2px; }
#janela { position: static; width: 100%; height: auto; margin: 10px 0; padding: 14px; background: color-mix(in srgb, var(--tinta) 5%, var(--papel)); }
.tarefa input[type=checkbox] { appearance: none; -webkit-appearance: none; flex: none; width: 22px; height: 22px; border: 2px solid var(--destaque); border-radius: 50%; background: transparent; cursor: pointer; transition: background-color .15s, box-shadow .15s; }
.tarefa input[type=checkbox]:checked { background: var(--destaque); box-shadow: inset 0 0 0 4px var(--papel); }
/* Botões do formulário de evento: colunas de mesma largura, ocupando toda a linha (2 ou 3 botões) */
#janela .acoes { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; justify-content: stretch; }
#janela .acoes button { width: 100%; padding: 10px 4px; text-align: center; }
#janela .perigo { margin-right: 0; }
/* Bullet de "feito" nos eventos do cronograma, na cor do evento */
.cron-item input[type=checkbox] { appearance: none; -webkit-appearance: none; grid-row: 1 / 3; align-self: center; width: 22px; height: 22px; margin: 0; border: 2px solid var(--cor); border-radius: 50%; background: transparent; cursor: pointer; transition: background-color .15s, box-shadow .15s; }
.cron-item input[type=checkbox]:checked { background: var(--cor); box-shadow: inset 0 0 0 4px var(--papel); }
.cron-item.feito button, .cron-item.feito time { text-decoration: line-through; color: var(--suave); }
.ev.feito { text-decoration: line-through; opacity: .6; }
/* Categorias criadas pela pessoa */
.cat-linha span { flex: 1; overflow-wrap: anywhere; }
.pers .cat-linha button { width: auto; flex: none; padding: 2px 9px; }
.cat-nova { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
.cat-nova #catNome { margin: 0; flex: 1; min-width: 0; }
.cat-nova input[type=color] { width: 48px; height: 38px; margin: 0; flex: none; }
.pers .cat-nova button { width: auto; flex: none; padding: 10px 12px; }
/* Animações de fundo: canvas fixo atrás do app; os painéis ficam translúcidos para a animação aparecer */
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.app { position: relative; z-index: 1; }
body.anim .grade, body.anim .painel { background: color-mix(in srgb, var(--papel) 62%, transparent); }   /* sem backdrop-filter: o desfoque refeito a cada quadro deixava computadores sem placa de vídeo muito lentos */
.cat-linha .cat-nome { width: auto; flex: 1; min-width: 0; height: auto; }
.versao { margin: 14px 0 0; font-size: .75rem; color: var(--suave); text-align: center; }
input[type=color] { height: 42px; padding: 2px; cursor: pointer; }
details.ajuda { font-size: .85rem; color: var(--suave); border: 1px solid var(--linha); border-radius: 8px; padding: 8px 10px; }
details.ajuda pre { overflow-x: auto; font-size: .72rem; background: var(--fundo); padding: 8px; border-radius: 6px; color: var(--tinta); }
body[data-fundo="esporos"] { background-image: radial-gradient(circle, color-mix(in srgb, var(--destaque) 40%, transparent) 0 1.5px, transparent 2.5px), radial-gradient(circle, color-mix(in srgb, var(--destaque) 18%, transparent) 0 3px, transparent 5px), radial-gradient(color-mix(in srgb, var(--tinta) 25%, transparent) 1px, transparent 1.5px); background-size: 97px 97px, 131px 131px, 43px 43px; background-position: 0 0, 40px 60px, 20px 10px; }
body[data-fundo="chuva"] { background-image: repeating-linear-gradient(105deg, transparent 0 14px, color-mix(in srgb, var(--destaque) 10%, transparent) 14px 15px); }

/* ===== 4. JANELA DE CRIAR/EDITAR (modal) ===== */
dialog { border: 1px solid var(--linha); border-radius: 12px; background: var(--papel); color: var(--tinta); width: min(92vw, 380px); padding: 20px; }
dialog::backdrop { background: rgba(0,0,0,.45); }
label { display: block; margin-top: 12px; font-size: .85rem; color: var(--suave); }
input { width: 100%; margin-top: 4px; font: inherit; color: var(--tinta); background: var(--fundo); border: 1px solid var(--linha); border-radius: 8px; padding: 8px 10px; }
.acoes { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.perigo { margin-right: auto; color: #c0392b; }
@media (max-width: 600px) { .dia { padding: 3px; } .ev { font-size: .68rem; padding: 1px 3px; } h1 { font-size: 1.5rem; } }
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="app">
  <header class="topo">
    <div class="marca">
      <!-- Lua tripla + pentagrama em SVG: 2 crescentes preenchidas, círculo central e estrela de 5 pontas -->
      <svg class="orn-svg" viewBox="0 0 120 40" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round">

<script>
/* ===== 0. FONTES SEM TRAVAR A PÁGINA =====
   Antes as fontes do Google eram pedidas no <head>, e o navegador esperava por elas antes de desenhar a tela.
   Sem internet (ou com internet lenta ou bloqueada), a página ficava em branco ou "travada".
   Agora a página aparece na hora com fontes comuns, e as fontes especiais entram se conseguirem carregar. */
(function () {
  const l = document.createElement("link");
  l.rel = "stylesheet";
  l.href = "https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;600&family=Pirata+One&family=New+Rocker&family=Metal+Mania&family=Cinzel:wght@500;700&family=Uncial+Antiqua&display=swap";
  document.head.appendChild(l);
})();
</script>
<script>
/* ===== 5. DADOS =====
   Categorias: cada uma tem nome e cor. Para criar uma nova, é só
   adicionar uma linha aqui. */
const CATEGORIAS = {
  trabalho: { nome: "Trabalho", cor: "#3b82c4" },
  estudo:   { nome: "Estudo",   cor: "#8b5cf6" },
  pessoal:  { nome: "Pessoal",  cor: "#e0813a" },
  saude:    { nome: "Saúde",    cor: "#2f9e75" }
};

/* Estado do app: o mês exibido, a lista de eventos e o evento sendo editado.
   Cada evento é um objeto: { id, data: "2026-11-22", titulo, hora, cat } */
let mesAtual = new Date();
mesAtual.setDate(1);
let eventos = [];
let modo = "mes";              // "mes" ou "semana"
let semanaRef = new Date();    // um dia qualquer da semana exibida
let cronDia = new Date();      // dia mostrado no cronograma (painel lateral)
let tarefas = [];   // tarefas gerais (carregadas mais abaixo; declarada aqui porque o cronograma já a lê)
let editando = null;   // evento em edição (null = criando novo)
let dataClicada = "";  // dia onde a pessoa clicou

/* ===== 6. SALVAR E CARREGAR =====
   localStorage guarda texto no navegador. Convertemos a lista para texto
   com JSON.stringify e de volta com JSON.parse. O try/catch evita que o
   app quebre se o armazenamento estiver bloqueado. */
function salvar() {
  try { localStorage.setItem("agenda-eventos", JSON.stringify(eventos)); } catch (e) {}
}
function carregar() {
  try {
    eventos = JSON.parse(localStorage.getItem("agenda-eventos")) || [];
    const t = localStorage.getItem("agenda-tema");
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) { eventos = []; }
}

/* ===== 7. DESENHAR O CALENDÁRIO =====
   Esta função apaga a grade e a monta de novo toda vez que algo muda. */
const grade = document.getElementById("grade");

// Converte uma data em texto "AAAA-MM-DD" (formato usado para guardar e comparar)
function chave(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

/* Fase da lua: o ciclo dura cerca de 29,53 dias. Contamos quantos dias se passaram
   desde uma lua nova conhecida (6/jan/2000) e dividimos o ciclo em 8 fases. */
function faseLua(d) {
  const dias = (Date.UTC(d.getFullYear(), d.getMonth(), d.getDate(), 12) - Date.UTC(2000, 0, 6, 18)) / 86400000;
  const ciclo = ((dias % 29.530588853) + 29.530588853) % 29.530588853;
  // p vai de 0 (lua nova) a 1. A parte iluminada é desenhada em SVG com 2 arcos:
  // o contorno externo e a "sombra" (elipse cuja largura rx varia com cos(2πp)).
  const p = ciclo / 29.530588853;
  const rx = (6.5 * Math.abs(Math.cos(2 * Math.PI * p))).toFixed(2);
  const lado = p < 0.5 ? 1 : 0;                                   // crescente: luz à direita; minguante: à esquerda
  const bojo = (p < 0.5) === (p < 0.25 || p > 0.75) ? 0 : 1;      // crescente fina ou gibosa: direção da sombra
  const ilum = Math.round((1 - Math.cos(2 * Math.PI * p)) / 2 * 100);
  return '<span class="lua" title="Lua ' + ilum + '% iluminada"><svg viewBox="-8 -8 16 16"><circle class="esc" r="6.5"/><path class="luz" d="M0 -6.5A6.5 6.5 0 0 ' + lado + ' 0 6.5A' + rx + ' 6.5 0 0 ' + bojo + ' 0 -6.5Z"/></svg></span>';
}

function desenhar() {
  grade.innerHTML = "";
  grade.className = "grade" + (modo === "semana" ? " sem" : "");
  if (modo === "semana") {   // título da semana: "16 nov – 22 nov 2026"
    const a = new Date(semanaRef); a.setDate(a.getDate() - a.getDay());
    const b = new Date(a); b.setDate(a.getDate() + 6);
    const f = x => x.toLocaleDateString("pt-BR", { day: "numeric", month: "short" });
    document.getElementById("titulo").textContent = f(a) + " – " + f(b) + " " + b.getFullYear();
  } else document.getElementById("titulo").textContent =
    mesAtual.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });

  // Cabeçalho com os dias da semana
  ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"].forEach(n => {
    const c = document.createElement("div");
    c.className = "semana"; c.textContent = n; grade.appendChild(c);
  });

  // O primeiro dia do mês cai em algum dia da semana (0 = domingo).
  // Voltamos esse tanto de dias para a grade começar sempre no domingo.
  const inicio = new Date(modo === "semana" ? semanaRef : mesAtual);
  inicio.setDate(modo === "semana" ? semanaRef.getDate() - semanaRef.getDay() : 1 - mesAtual.getDay());
  const hoje = chave(new Date());

  // 42 células = 6 semanas, o suficiente para qualquer mês
  for (let i = 0; i < (modo === "semana" ? 7 : 42); i++) {
    const d = new Date(inicio);
    d.setDate(inicio.getDate() + i);
    const k = chave(d);

    const cel = document.createElement("div");
    cel.className = "dia" + (modo === "mes" && d.getMonth() !== mesAtual.getMonth() ? " fora" : "") + (k === hoje ? " hoje" : "") + (k === chave(cronDia) ? " sel" : "");
    cel.innerHTML = '<span class="num">' + d.getDate() + '</span>' + faseLua(d);
    cel.onclick = () => selecionarDia(d);   // clicar no dia só seleciona: quem gerencia é o cronograma

    // Eventos deste dia, ordenados por horário
    eventos.filter(e => e.data === k)
      .sort((a, b) => (a.hora || "").localeCompare(b.hora || ""))
      .forEach(e => {
        const b = document.createElement("button");
        b.className = "ev" + (e.feito ? " feito" : "");   // evento feito aparece riscado
        b.style.setProperty("--cor", corDe(e));   // cor do evento (ou da categoria)
        b.textContent = (e.hora ? e.hora + " " : "") + e.titulo;
        b.onclick = ev => { ev.stopPropagation(); abrirJanela(k, e); }; // stopPropagation: não abre "novo" junto
        cel.appendChild(b);
      });
    grade.appendChild(cel);
  }
  renderCron();   // mantém o cronograma lateral atualizado
}

/* ===== 8. JANELA DE EVENTO ===== */
const janela = document.getElementById("janela");
const fCat = document.getElementById("fCat");
Object.entries(CATEGORIAS).forEach(([id, c]) => fCat.add(new Option(c.nome, id)));

const MAX_POR_DIA = 10;   // limite de compromissos por dia
function abrirJanela(data, evento) {
  document.getElementById("erro").textContent = "";
  const [ano, mes, dia] = data.split("-").map(Number);   // o formulário abre no cronograma, no dia do evento
  cronDia = new Date(ano, mes - 1, dia);
  aba("cron"); desenhar();
  editando = evento; dataClicada = data;
  const n = eventos.filter(e => e.data === data).length;   // quantos já existem neste dia
  document.getElementById("janelaTitulo").textContent = (evento ? "Editar evento" : "Novo evento") + " (" + n + "/" + MAX_POR_DIA + " no dia)";
  document.getElementById("fTitulo").value = evento ? evento.titulo : "";
  document.getElementById("fHora").value = evento ? evento.hora : "";
  fCat.value = evento ? evento.cat : "trabalho";
  document.getElementById("fCor").value = corDe(evento || { cat: "trabalho" });   // mostra a cor atual do evento
  document.getElementById("fUsaCat").checked = !(evento && evento.cor);
  document.getElementById("excluir").style.display = evento ? "" : "none";
  janela.show(); janela.scrollIntoView({ block: "nearest" });   // show() abre sem pop-up (sem fundo escuro)
  document.getElementById("fTitulo").focus();
}

document.getElementById("salvar").onclick = () => {
  const titulo = document.getElementById("fTitulo").value.trim();
  if (!editando && eventos.filter(e => e.data === dataClicada).length >= MAX_POR_DIA) {   // barra o 11º compromisso
    document.getElementById("erro").textContent = "Limite de " + MAX_POR_DIA + " compromissos neste dia.";
    return;
  }
  if (!titulo) return;                       // não salva evento sem título
  const dados = { titulo, hora: document.getElementById("fHora").value, cat: fCat.value,
    cor: document.getElementById("fUsaCat").checked ? "" : document.getElementById("fCor").value };   // cor vazia = usa a da categoria
  if (editando) Object.assign(editando, dados);                 // atualiza o existente
  else eventos.push({ id: Date.now(), data: dataClicada, ...dados }); // cria novo
  salvar(); janela.close(); desenhar();
};
document.getElementById("excluir").onclick = () => {
  eventos = eventos.filter(e => e !== editando);
  salvar(); janela.close(); desenhar();
};
document.getElementById("cancelar").onclick = () => janela.close();

/* ===== 9. NAVEGAÇÃO E TEMA ===== */
// Navegar: no modo semana anda 7 dias; no modo mês anda 1 mês
function mover(n) {
  if (modo === "semana") semanaRef.setDate(semanaRef.getDate() + 7 * n);
  else mesAtual.setMonth(mesAtual.getMonth() + n);
  desenhar();
}
document.getElementById("ant").onclick = () => mover(-1);
document.getElementById("prox").onclick = () => mover(1);
document.getElementById("hojeBtn").onclick = () => { mesAtual = new Date(); mesAtual.setDate(1); semanaRef = new Date(); desenhar(); };
function trocarModo(m) {
  const h = new Date();
  if (m === "semana") semanaRef = (h.getMonth() === mesAtual.getMonth() && h.getFullYear() === mesAtual.getFullYear()) ? h : new Date(mesAtual);
  else mesAtual = new Date(semanaRef.getFullYear(), semanaRef.getMonth(), 1);
  modo = m;
  document.getElementById("vMes").setAttribute("aria-pressed", String(m === "mes"));
  document.getElementById("vSem").setAttribute("aria-pressed", String(m === "semana"));
  desenhar();
}
document.getElementById("vMes").onclick = () => trocarModo("mes");
document.getElementById("vSem").onclick = () => trocarModo("semana");

const seletorTema = document.getElementById("tema");
seletorTema.onchange = () => {
  // "papel" é o tema padrão (sem atributo); os outros usam [data-theme]
  document.documentElement.dataset.theme = seletorTema.value;
  visual.cores = {}; aplicarVisual();   // escolher um tema limpa as cores personalizadas
  try { localStorage.setItem("agenda-tema", seletorTema.value); } catch (e) {}
};

/* Personalização extra: fonte do título, textura de fundo e ornamentos.
   Tudo fica no objeto "visual", salvo no localStorage junto com o tema. */
const FONTES = {
  classica: '"Bricolage Grotesque", Georgia, serif',
  gotica: '"Pirata One", Georgia, serif',
  rock: '"New Rocker", Georgia, serif',
  metal: '"Metal Mania", Georgia, serif',
  cinzel: '"Cinzel", Georgia, serif',
  uncial: '"Uncial Antiqua", Georgia, serif'
};
const NOMES_COR = ["fundo", "papel", "tinta", "suave", "linha", "destaque", "hoje"];   // as 7 cores de um visual
const seletorFonte = document.getElementById("fonte");
const seletorFundo = document.getElementById("fundo");
const btnOrn = document.getElementById("orn");
let visual = { fonte: "tema", fundo: "liso", orn: false, cores: {}, imagem: "", anim: "nenhuma", vel: 1 };
try { visual = { ...visual, ...JSON.parse(localStorage.getItem("agenda-visual")) }; } catch (e) {}

// Aplica as escolhas na página: troca a variável da fonte, o atributo do fundo e a classe .orn
function aplicarVisual() {
  const raiz = document.documentElement;
  // Cores personalizadas (escolhidas ou importadas) ficam inline e vencem as do tema
  NOMES_COR.forEach(n => raiz.style.removeProperty("--" + n));
  Object.entries(visual.cores || {}).forEach(([n, v]) => raiz.style.setProperty("--" + n, v));
  if (visual.cores && visual.cores.destaque && !visual.cores.hoje) raiz.style.setProperty("--hoje", "color-mix(in srgb, var(--destaque) 18%, var(--papel))");
  const bs = document.body.style;   // imagem de fundo do aparelho (se houver) vence a textura
  bs.backgroundImage = visual.imagem ? 'url("' + visual.imagem + '")' : "";
  bs.backgroundSize = visual.imagem ? "cover" : ""; bs.backgroundAttachment = visual.imagem ? "fixed" : "";
  if (visual.fonte === "tema") raiz.style.removeProperty("--fonte-titulo");
  else raiz.style.setProperty("--fonte-titulo", FONTES[visual.fonte]);
  document.body.dataset.fundo = visual.fundo;
  document.body.classList.toggle("orn", visual.orn);
  btnOrn.setAttribute("aria-pressed", String(visual.orn));
  seletorFonte.value = visual.fonte;
  seletorFundo.value = visual.fundo;
  document.getElementById("anim").value = visual.anim;
  document.getElementById("vel").value = visual.vel;
  setFx(visual.anim);   // liga, troca ou desliga a animação de fundo
  const dst = getComputedStyle(raiz).getPropertyValue("--destaque").trim();   // mantém o seletor e as bolinhas em sincronia
  const cd = document.getElementById("corDest");

function bipe() {           // beep curto feito com Web Audio; se o navegador bloquear, ignora

    o.frequency.value = 660; g.gain.value = 0.15; o.connect(g); g.connect(ac.destination);

}

// Desenha uma linha de tarefa. Se "pai" existe, é uma tarefa específica dentro dele.
function itemTarefa(t, pai) {
  const row = document.createElement("div"); row.className = "tarefa" + (t.feita ? " feita" : "");
  const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = t.feita; cb.setAttribute("aria-label", "Concluir tarefa");
  cb.onchange = () => marcarTarefa(t, cb.checked);
  const corpo = document.createElement("div"); corpo.className = "corpo";
  const tx = document.createElement("span"); tx.textContent = t.texto; corpo.appendChild(tx);
  if (t.desc) { const d = document.createElement("small"); d.textContent = t.desc; corpo.appendChild(d); }   // descrição
  if (t.data) { const dt = document.createElement("small"); dt.textContent = "Para " + t.data.split("-").reverse().join("/"); corpo.appendChild(dt); }
  row.append(cb, corpo);
  if (!pai) {   // tarefa geral mostra o progresso das específicas
    const p = document.createElement("span"); p.className = "prog";
    p.textContent = t.sub.filter(s => s.feita).length + "/" + t.sub.length; row.appendChild(p);
  }
  const x = document.createElement("button"); x.textContent = "×"; x.setAttribute("aria-label", "Excluir tarefa");
  x.onclick = () => { if (pai) pai.sub = pai.sub.filter(o => o !== t); else tarefas = tarefas.filter(o => o !== t); salvarTar(); };
  row.appendChild(x);
  return row;
}
function renderTar() {
  listaTar.innerHTML = "";
  tarefas.forEach(t => {
    t.sub = t.sub || [];   // tarefas antigas ainda não tinham específicas
    const det = document.createElement("details"); det.className = "geral"; det.open = abertas.has(t.id);
    det.ontoggle = () => { if (det.open) abertas.add(t.id); else abertas.delete(t.id); };
    const sm = document.createElement("summary"); sm.appendChild(itemTarefa(t, null));
    const subs = document.createElement("ul"); subs.className = "subs";
    t.sub.forEach(s => { const li = document.createElement("li"); li.appendChild(itemTarefa(s, t)); subs.appendChild(li); });
    // Formulário para adicionar uma tarefa específica dentro desta tarefa geral
    const f = document.createElement("div"); f.className = "nova nova-col";
    const i1 = document.createElement("input"); i1.placeholder = "Nova tarefa específica"; i1.maxLength = 80;
    const i2 = document.createElement("input"); i2.placeholder = "Descrição (opcional)"; i2.maxLength = 200;
    const i3 = document.createElement("input"); i3.type = "date";
    const l3 = document.createElement("label"); l3.textContent = "Data (opcional)"; l3.appendChild(i3);
    const bt = document.createElement("button"); bt.textContent = "Adicionar específica";
    bt.onclick = () => {

      t.sub.push({ id: Date.now(), texto: v, desc: i2.value.trim(), data: i3.value, feita: false });

  });
  const feitas = tarefas.filter(t => t.feita).length;
  document.getElementById("contTar").textContent = tarefas.length ? feitas + " de " + tarefas.length + " concluídas" : "Nenhuma tarefa ainda. Escreva uma acima.";

/* ===== 14. CRONOGRAMA LATERAL =====
   Linha do tempo do dia escolhido: eventos sem horário primeiro, depois por horário. */
function renderCron() {
  const k = chave(cronDia), ul = document.getElementById("cLista");
  document.getElementById("cTitulo").textContent = cronDia.toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  ul.innerHTML = "";
  const dia = eventos.filter(e => e.data === k).sort((a, b) => (a.hora || "").localeCompare(b.hora || ""));
  // Tarefas (gerais e específicas) que têm a data deste dia
  const doDia = [];
  tarefas.forEach(t => {
    if (t.data === k) doDia.push({ t, pai: null });
    (t.sub || []).forEach(s => { if (s.data === k) doDia.push({ t: s, pai: t }); });
  });
  if (!dia.length && !doDia.length) ul.innerHTML = '<li class="vazio">Nada marcado neste dia. Tarefas com data aparecem aqui.</li>';
  dia.forEach(e => {
    const li = document.createElement("li"); li.className = "cron-item" + (e.feito ? " feito" : ""); li.style.setProperty("--cor", corDe(e));
    const h = document.createElement("time"); h.textContent = e.hora || "Dia todo";
    const b = document.createElement("button"); b.textContent = e.titulo; b.onclick = () => abrirJanela(k, e);   // clicar abre a edição
    const c = document.createElement("small"); c.textContent = CATEGORIAS[e.cat].nome;
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!e.feito; cb.setAttribute("aria-label", "Marcar evento como feito");
    cb.onchange = () => { e.feito = cb.checked; salvar(); desenhar(); if (cb.checked) parabens(e.titulo, "Evento concluído"); };   // salvar() guarda os eventos; desenhar() atualiza calendário e cronograma
    li.append(cb, h, b, c); ul.appendChild(li);
  });
  if (doDia.length) {   // bloco "Tarefas do dia", logo abaixo dos eventos
    const sep = document.createElement("li"); sep.className = "cron-sep"; sep.textContent = "Tarefas do dia"; ul.appendChild(sep);
    doDia.forEach(({ t, pai }) => {
      const li = document.createElement("li"); li.className = "tarefa" + (t.feita ? " feita" : "");
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = t.feita; cb.setAttribute("aria-label", "Concluir tarefa");
      cb.onchange = () => marcarTarefa(t, cb.checked);

      const tx = document.createElement("span"); tx.textContent = pai ? t.texto + " (" + pai.texto + ")" : t.texto; corpo.appendChild(tx);
      if (t.desc) { const d = document.createElement("small"); d.textContent = t.desc; corpo.appendChild(d); }
      li.append(cb, corpo); ul.appendChild(li);
    });
  }
}

/* ===== 18. ANIMAÇÕES DE FUNDO =====
   Um <canvas> fixo atrás do app. Cada modo é um tipo de partícula que se move a cada quadro
   (requestAnimationFrame) e usa as cores do tema (--destaque e --tinta). */
var fxPronto = false;   // var de propósito: aplicarVisual() já chama setFx() antes deste código rodar
const fxCanvas = document.getElementById("fx"), fxCtx = fxCanvas.getContext("2d");
let fxModo = "", fxRaf = 0, fxPartes = [], fxW = 0, fxH = 0, fxCor = "#fff", fxTinta = "#fff", fxCont = 0, fxCadente = null;

// Cada tema tem uma animação sugerida (usada no modo "Automática")
const FX_DO_TEMA = { bruxa: "estrelas", grimorio: "estrelas", vampiro: "morcegos", cemiterio: "morcegos", hollow: "esporos", metal: "brasas", punk: "chuva", skz: "brasas", maneskin: "glitter" };

function fxTamanho() {   // canvas com resolução real da tela (nitidez em telas de alta densidade)
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);   // partículas são suaves: não precisam de resolução máxima, e isso poupa processamento
  fxW = innerWidth; fxH = innerHeight;
  fxCanvas.width = fxW * dpr; fxCanvas.height = fxH * dpr;
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function fxCriar() {   // cria as partículas do modo atual (quantidade proporcional ao tamanho da tela)
  const n = Math.min(140, Math.round(fxW * fxH / 14000));
  const q = { estrelas: n * 1.4, esporos: n * 0.7, chuva: n * 1.2, brasas: n * 0.6, morcegos: Math.max(4, Math.round(fxW / 260)), glitter: n * 0.5 }[fxModo] | 0;
  const R = (a, b) => a + Math.random() * (b - a);
  fxPartes = [];
  for (let i = 0; i < q; i++) fxPartes.push({ x: R(0, fxW), y: R(0, fxH), r: R(0.9, 3), v: R(0.5, 1.6), f: R(0, 6.28), l: R(10, 24), s: R(0.8, 1.3), d: Math.random() < 0.5 ? 1 : -1 });
}
function fxDesenhar(t) {   // desenha um quadro; t = tempo em milissegundos
  const c = fxCtx, V = visual.vel || 1;   // V = multiplicador de velocidade (controle no painel)
  c.clearRect(0, 0, fxW, fxH);
  if (++fxCont % 30 === 1) {   // lê as cores do tema de vez em quando (acompanha troca de tema ou de cor)
    const cs = getComputedStyle(document.documentElement);
    fxCor = cs.getPropertyValue("--destaque").trim() || "#fff"; fxTinta = cs.getPropertyValue("--tinta").trim() || "#fff";
  }
  fxPartes.forEach((p, i) => {
    switch (fxModo) {
      case "estrelas":   // pontos que cintilam (o brilho oscila com seno)
        p.x -= 0.25 * p.v * V; if (p.x < -5) p.x = fxW + 5;   // as estrelas derivam devagar para a esquerda
        c.globalAlpha = 0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t / 500 * p.v * V + p.f));
        c.fillStyle = i % 4 === 0 ? fxCor : fxTinta;
        c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.283); c.fill(); break;
      case "esporos":   // luzinhas que sobem balançando, com um halo suave
        p.y -= p.v * 0.8 * V; p.x += Math.sin(t / 1200 + p.f) * 0.5 * V;
        if (p.y < -10) { p.y = fxH + 10; p.x = Math.random() * fxW; }
        c.fillStyle = fxCor;
        c.globalAlpha = 0.2; c.beginPath(); c.arc(p.x, p.y, p.r * 4, 0, 6.283); c.fill();
        c.globalAlpha = 0.9; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.283); c.fill(); break;
      case "chuva":   // riscos inclinados que caem e voltam ao topo
        p.y += p.v * 12 * V; p.x -= p.v * 2.4 * V;
        if (p.y > fxH) { p.y = -p.l; p.x = Math.random() * (fxW + 100); }
        c.globalAlpha = 0.4; c.strokeStyle = fxCor; c.lineWidth = 1.2;
        c.beginPath(); c.moveTo(p.x, p.y); c.lineTo(p.x - p.l * 0.2, p.y + p.l); c.stroke(); break;
      case "brasas":   // faíscas que sobem e vão sumindo
        p.y -= p.v * 1.6 * V; p.x += Math.sin(t / 500 + p.f) * 0.9 * V;
        if (p.y < -10) { p.y = fxH + 10; p.x = Math.random() * fxW; }
        c.fillStyle = fxCor; c.globalAlpha = Math.max(0, p.y / fxH) * 0.9;
        c.beginPath(); c.arc(p.x, p.y, p.r, 0, 6.283); c.fill(); break;
      case "morcegos": {   // silhueta de morcego; a abertura das asas (a) oscila com seno
        p.x += p.d * p.v * 2.2 * V; p.y += Math.sin(t / 400 + p.f) * 0.9 * V;
        if (p.d > 0 && p.x > fxW + 40) p.x = -40; else if (p.d < 0 && p.x < -40) p.x = fxW + 40;
        const a = Math.sin(t / 90 * V + p.f) * 9;
        c.save(); c.translate(p.x, p.y); c.scale(p.s * 1.8 * p.d, p.s * 1.8);
        c.fillStyle = fxCor; c.globalAlpha = 0.7;
        c.beginPath(); c.moveTo(0, 0);
        c.quadraticCurveTo(-12, -14 - a, -28, -4 - a); c.quadraticCurveTo(-22, -a / 2, -18, 5);
        c.quadraticCurveTo(-13, 1, -9, 7); c.quadraticCurveTo(-4, 3, 0, 8);
        c.quadraticCurveTo(4, 3, 9, 7); c.quadraticCurveTo(13, 1, 18, 5);
        c.quadraticCurveTo(22, -a / 2, 28, -4 - a); c.quadraticCurveTo(12, -14 - a, 0, 0);
        c.closePath(); c.fill();
        c.beginPath(); c.ellipse(0, 3, 3.2, 6, 0, 0, 6.283); c.fill();
        c.restore(); break;
      }
      case "glitter": {   // estrelinhas de 4 pontas que crescem e encolhem
        p.y += 0.3 * p.v * V; if (p.y > fxH + 5) p.y = -5;   // o glitter cai devagar enquanto brilha
        const k = 0.5 + 0.5 * Math.sin(t / 400 * p.v * V + p.f), r = p.r * 2.6 * k;
        c.globalAlpha = k; c.fillStyle = i % 3 ? fxCor : fxTinta;
        c.beginPath(); c.moveTo(p.x, p.y - r); c.lineTo(p.x + r * 0.22, p.y - r * 0.22); c.lineTo(p.x + r, p.y);
        c.lineTo(p.x + r * 0.22, p.y + r * 0.22); c.lineTo(p.x, p.y + r); c.lineTo(p.x - r * 0.22, p.y + r * 0.22);
        c.lineTo(p.x - r, p.y); c.lineTo(p.x - r * 0.22, p.y - r * 0.22); c.closePath(); c.fill(); break;
      }
    }
  });
  if (fxModo === "estrelas") {   // de vez em quando cruza uma estrela cadente
    if (!fxCadente && Math.random() < 0.006) fxCadente = { x: Math.random() * fxW, y: Math.random() * fxH * 0.4, vx: 7, vy: 3.5, vida: 1 };
    if (fxCadente) {
      const s = fxCadente; s.x += s.vx * V; s.y += s.vy * V; s.vida -= 0.012;
      c.globalAlpha = Math.max(0, s.vida); c.strokeStyle = fxTinta; c.lineWidth = 1.5;
      c.beginPath(); c.moveTo(s.x, s.y); c.lineTo(s.x - s.vx * 8, s.y - s.vy * 8); c.stroke();
      if (s.vida <= 0) fxCadente = null;
    }
  }
  c.globalAlpha = 1;
}
function fxLoop(t) { fxDesenhar(t); fxRaf = requestAnimationFrame(fxLoop); }   // repete a cada quadro, sempre em movimento

// Liga, troca ou desliga a animação. "auto" escolhe a do tema atual.
function setFx(modo) {
  if (!fxPronto) return;
  const real = modo === "auto" ? (FX_DO_TEMA[document.documentElement.dataset.theme] || "nenhuma") : modo;
  document.body.classList.toggle("anim", real !== "nenhuma");   // deixa os painéis translúcidos
  if (real === fxModo) return;
  cancelAnimationFrame(fxRaf); fxModo = real; fxCtx.clearRect(0, 0, fxW, fxH);
  if (real === "nenhuma") return;
  fxCriar(); fxRaf = requestAnimationFrame(fxLoop);
}
window.addEventListener("resize", () => { fxTamanho(); if (fxModo && fxModo !== "nenhuma") fxCriar(); });
document.getElementById("anim").onchange = e => { visual.anim = e.target.value; aplicarVisual(); };
document.getElementById("vel").oninput = e => { visual.vel = parseFloat(e.target.value); aplicarVisual(); };
fxTamanho(); fxPronto = true; setFx(visual.anim);
</script>
